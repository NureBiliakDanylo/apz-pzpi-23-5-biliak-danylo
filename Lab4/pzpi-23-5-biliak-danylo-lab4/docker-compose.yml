services:
  db:
    image: postgres:15-alpine
    command: postgres -c max_connections=1000 -c synchronous_commit=off -c shared_buffers=256MB -c checkpoint_timeout=15min
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: weather
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./src/db_schema.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:admin@db:5432/weather
      JWT_SECRET: super-secret-weather-key
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
